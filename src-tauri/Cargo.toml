[package]
name = "postnot"
version = "0.24.1"
description = "Local-first desktop API client"
authors = ["PostNot"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "postnot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.4", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
encoding_rs = "0.8"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
log = "0.4"
memchr = "2"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "charset", "deflate", "gzip", "http2", "json", "multipart", "rustls-tls", "stream", "zstd"] }
rmcp = { version = "=0.16.0", features = ["server", "transport-io"] }
rust_socketio = { path = "vendor/rust_socketio-0.6.0", version = "=0.6.0", features = ["async"] }
schemars = "1.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shlex = "1.3"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "runtime-tokio-rustls", "sqlite", "uuid"] }
tauri = { version = "2.3.1", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "=0.30.0", features = ["native-tls"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
