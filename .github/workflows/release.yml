name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npx tauri icon src-tauri/app-icon.svg --output src-tauri/icons

      - name: Validate frontend types
        run: npm run check

      - name: Check docs screenshot freshness
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: true
        run: npm run docs:check-screenshots

      - name: Extract release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          node <<'EOF' >> "$GITHUB_OUTPUT"
          const fs = require("fs");

          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const lines = changelog.split(/\r?\n/);
          const headingIndex = lines.findIndex((line) => line.startsWith(`## [${version}]`));
          const nextHeadingIndex = lines.findIndex(
            (line, index) => index > headingIndex && line.startsWith("## [")
          );

          if (headingIndex < 0) {
            throw new Error(`Could not find CHANGELOG.md notes for version ${version}.`);
          }

          const releaseNotes = lines
            .slice(headingIndex + 1, nextHeadingIndex < 0 ? undefined : nextHeadingIndex)
            .join("\n")
            .trim();
          const delimiter = `RELEASE_NOTES_${Date.now()}`;

          console.log(`body<<${delimiter}`);
          console.log(releaseNotes || `PostNot v${version}`);
          console.log(delimiter);
          EOF

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for signed updater artifacts consumed by the in-app updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Optional if the updater private key is password-protected.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Platform signing examples:
          # Windows examples:
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # macOS examples:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "PostNot v__VERSION__"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  publish-updater-json:
    needs: build-and-release
    runs-on: ubuntu-22.04

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build combined updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p .release-sigs
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > release.json
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "*.sig" --dir .release-sigs

          node <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME;
          const repo = process.env.GITHUB_REPOSITORY;
          const assetBaseUrl = `https://github.com/${repo}/releases/download/${tag}`;

          const assets = release.assets ?? [];
          const sigDir = ".release-sigs";
          const sigByName = new Map();
          const missing = [];

          for (const fileName of fs.readdirSync(sigDir)) {
            sigByName.set(fileName, fs.readFileSync(path.join(sigDir, fileName), "utf8").trim());
          }

          const platforms = {};

          function findAsset(description, predicate) {
            const asset = assets.find(predicate);

            if (!asset) {
              missing.push(description);
            }

            return asset;
          }

          function addPlatform(key, asset, signatureName) {
            const signature = sigByName.get(signatureName);

            if (!signature) {
              missing.push(`${signatureName} signature`);
              return;
            }

            platforms[key] = {
              signature,
              url: `${assetBaseUrl}/${encodeURIComponent(asset.name)}`
            };
          }

          const nsisAsset = assets.find((entry) => entry.name.endsWith("-setup.exe"));
          const msiAsset = assets.find((entry) => entry.name.endsWith(".msi"));
          const appImageAsset = findAsset("Linux AppImage", (entry) => entry.name.endsWith(".AppImage"));
          const debAsset = findAsset("Linux Debian package", (entry) => entry.name.endsWith(".deb"));
          const rpmAsset = findAsset("Linux RPM package", (entry) => entry.name.endsWith(".rpm"));
          const macIntelAsset = findAsset("macOS x64 app archive", (entry) => entry.name.endsWith("_x64.app.tar.gz"));
          const macArmAsset = findAsset("macOS aarch64 app archive", (entry) => entry.name.endsWith("_aarch64.app.tar.gz"));

          if (nsisAsset) {
            addPlatform("windows-x86_64-nsis", nsisAsset, `${nsisAsset.name}.sig`);
          }

          if (msiAsset) {
            addPlatform("windows-x86_64", msiAsset, `${msiAsset.name}.sig`);
          } else if (nsisAsset) {
            addPlatform("windows-x86_64", nsisAsset, `${nsisAsset.name}.sig`);
          } else {
            missing.push("Windows MSI or NSIS installer");
          }

          if (appImageAsset) {
            addPlatform("linux-x86_64-appimage", appImageAsset, `${appImageAsset.name}.sig`);
            addPlatform("linux-x86_64", appImageAsset, `${appImageAsset.name}.sig`);
          }

          if (debAsset) {
            addPlatform("linux-x86_64-deb", debAsset, `${debAsset.name}.sig`);
          }

          if (rpmAsset) {
            addPlatform("linux-x86_64-rpm", rpmAsset, `${rpmAsset.name}.sig`);
          }

          if (macIntelAsset) {
            addPlatform("darwin-x86_64", macIntelAsset, `${macIntelAsset.name}.sig`);
          }

          if (macArmAsset) {
            addPlatform("darwin-aarch64", macArmAsset, `${macArmAsset.name}.sig`);
          }

          if (missing.length > 0) {
            throw new Error(`Cannot build complete updater manifest. Missing: ${missing.join(", ")}.`);
          }

          const latest = {
            version: release.tag_name,
            notes: release.body ?? "",
            pub_date: release.published_at ?? release.created_at ?? new Date().toISOString(),
            platforms
          };

          fs.writeFileSync("latest.json", `${JSON.stringify(latest, null, 2)}\n`);
          EOF

      - name: Upload combined updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" latest.json --repo "${GITHUB_REPOSITORY}" --clobber
