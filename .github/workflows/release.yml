name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npx tauri icon src-tauri/app-icon.svg --output src-tauri/icons

      - name: Validate frontend types
        run: npm run check

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for signed updater artifacts consumed by the in-app updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Optional if the updater private key is password-protected.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Platform signing examples:
          # Windows examples:
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # macOS examples:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "PostNot v__VERSION__"
          releaseBody: "See CHANGELOG.md for details and the assets below for platform builds."
          releaseDraft: true
          prerelease: true
          retryAttempts: 2
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  publish-updater-json:
    needs: build-and-release
    runs-on: ubuntu-22.04

    steps:
      - name: Build combined updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p .release-sigs
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > release.json
          gh release download "${GITHUB_REF_NAME}" --pattern "*.sig" --dir .release-sigs

          node <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME;
          const repo = process.env.GITHUB_REPOSITORY;
          const assetBaseUrl = `https://github.com/${repo}/releases/download/${tag}`;

          const assets = release.assets ?? [];
          const sigDir = ".release-sigs";
          const sigByName = new Map();

          for (const fileName of fs.readdirSync(sigDir)) {
            sigByName.set(fileName, fs.readFileSync(path.join(sigDir, fileName), "utf8").trim());
          }

          const platforms = {};

          function addPlatform(key, assetName, signatureName) {
            const asset = assets.find((entry) => entry.name === assetName);
            const signature = sigByName.get(signatureName);

            if (!asset || !signature) {
              return;
            }

            platforms[key] = {
              signature,
              url: `${assetBaseUrl}/${asset.name}`
            };
          }

          const nsisAsset = assets.find((entry) => entry.name.endsWith("-setup.exe"));
          const msiAsset = assets.find((entry) => entry.name.endsWith(".msi"));
          const appImageAsset = assets.find((entry) => entry.name.endsWith(".AppImage"));
          const macIntelAsset = assets.find((entry) => entry.name.endsWith("_x64.app.tar.gz"));
          const macArmAsset = assets.find((entry) => entry.name.endsWith("_aarch64.app.tar.gz"));

          if (nsisAsset) {
            addPlatform("windows-x86_64-nsis", nsisAsset.name, `${nsisAsset.name}.sig`);
          }

          if (msiAsset) {
            addPlatform("windows-x86_64", msiAsset.name, `${msiAsset.name}.sig`);
          } else if (nsisAsset) {
            addPlatform("windows-x86_64", nsisAsset.name, `${nsisAsset.name}.sig`);
          }

          if (appImageAsset) {
            addPlatform("linux-x86_64", appImageAsset.name, `${appImageAsset.name}.sig`);
          }

          if (macIntelAsset) {
            addPlatform("darwin-x86_64", macIntelAsset.name, `${macIntelAsset.name}.sig`);
          }

          if (macArmAsset) {
            addPlatform("darwin-aarch64", macArmAsset.name, `${macArmAsset.name}.sig`);
          }

          const latest = {
            version: release.tag_name,
            notes: release.body ?? "",
            pub_date: release.published_at ?? release.created_at ?? new Date().toISOString(),
            platforms
          };

          fs.writeFileSync("latest.json", `${JSON.stringify(latest, null, 2)}\n`);
          EOF

      - name: Upload combined updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" latest.json --clobber
